<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SleepTimer</title>

    <meta name="description" content="Calcula horas de sueño y despertar a partir de ciclos aproximados de 90 minutos." />
    <meta name="author" content="Renzo Fernando Mosquera Daza" />
    <meta name="theme-color" content="#020408" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon (ahora en /web) -->
    <link rel="icon" href="assets/favicon.ico" />

    <!-- Tailwind (CDN) + Fuente -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Estilos y scripts -->
    <link rel="stylesheet" href="web/style.css" />
    <script src="web/common.js" defer></script>
    <script src="web/app.js" defer></script>
</head>

<body>
<!-- Fondo -->
<div id="stars-container" aria-hidden="true"></div>

<main class="app-shell" role="main">
    <header class="app-header unified-header">
        <div class="brand-row">
            <h1 class="app-title">SleepTimer</h1>
        </div>

        <nav class="app-nav mode-switch" aria-label="Modo de cálculo">
            <button id="wake-mode-btn" class="nav-link active" type="button" aria-pressed="true">Hora de Despertar</button>
            <button id="sleep-mode-btn" class="nav-link" type="button" aria-pressed="false">Hora de Dormir</button>
        </nav>
    </header>

    <section class="workspace" aria-live="polite">
        <div id="wake-controls" class="mode-controls">
            <div class="control-grid">
                <section class="control-card">
                    <span class="control-label">Hora base</span>
                    <strong id="current-time" class="control-value">--:--</strong>
                    <button id="open-time-modal-btn" class="control-action" type="button">Cambiar hora</button>
                </section>

                <section class="control-card">
                    <label class="control-label" for="wake-delay-minutes-input">Tiempo para conciliar el sueño</label>
                    <div class="compact-number">
                        <input type="number" id="wake-delay-minutes-input" value="5" min="0" max="60" inputmode="numeric" aria-label="Minutos que tardas en dormir" />
                        <span>min</span>
                    </div>
                </section>
            </div>
        </div>

        <div id="sleep-controls" class="mode-controls hidden">
            <div class="control-grid sleep-control-grid">
                <section class="control-card control-card-wide">
                    <span class="control-label">Quiero despertar</span>
                    <div class="wake-target-grid">
                        <input type="date" id="wake-up-date" class="date-input" aria-label="Fecha de despertar" />
                        <div class="time-selectors-inline" aria-label="Hora de despertar">
                            <select id="wake-hour-select" aria-label="Hora"></select>
                            <span class="time-sep">:</span>
                            <select id="wake-minute-select" aria-label="Minutos"></select>
                            <select id="wake-ampm-select" aria-label="AM o PM">
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="control-card">
                    <label class="control-label" for="sleep-delay-minutes-input">Tiempo para conciliar el sueño</label>
                    <div class="compact-number">
                        <input type="number" id="sleep-delay-minutes-input" value="5" min="0" max="60" inputmode="numeric" aria-label="Minutos que tardas en dormir" />
                        <span>min</span>
                    </div>
                </section>
            </div>
        </div>

        <section class="results-section">
            <div class="results-heading">
                <div>
                    <span class="results-kicker" id="results-kicker">Si te acuestas ahora</span>
                    <h2 id="results-title">Horas para despertar</h2>
                </div>
                <button id="how-it-works-btn" class="help-button" type="button">Cómo funciona</button>
            </div>

            <div id="results-container" class="results-list" aria-live="polite"></div>
        </section>
    </section>
</main>

<footer class="project-footer">
    <p><a href="https://github.com/RenzoFernando/SleepTimer" target="_blank" rel="noopener noreferrer"><strong>SleepTimer</strong></a> — Cálculo de ciclos de sueño</p>
    <p>© 2026 — Renzo Fernando Mosquera Daza</p>
</footer>

<!-- Toast -->
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<!-- Modal: seleccionar hora base -->
<div id="time-picker-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="time-modal-title">
    <div class="modal-content">
        <h3 id="time-modal-title" class="modal-title">Elige tu hora base</h3>
        <p class="modal-subtitle">Úsala cuando quieras calcular desde una hora distinta a la actual.</p>

        <div class="time-selectors">
            <div class="time-selector">
                <label for="base-hour-select">Hora</label>
                <select id="base-hour-select" aria-label="Hora"></select>
            </div>

            <div class="time-selector">
                <label for="base-minute-select">Minutos</label>
                <select id="base-minute-select" aria-label="Minutos"></select>
            </div>

            <div class="time-selector">
                <label for="base-ampm-select">AM/PM</label>
                <select id="base-ampm-select" aria-label="AM o PM">
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>
            </div>
        </div>

        <div class="modal-actions">
            <button id="use-current-time-btn" class="modal-button secondary" type="button">Usar hora actual</button>
            <button id="confirm-time-btn" class="modal-button primary" type="button">Confirmar</button>
        </div>
    </div>
</div>

<!-- Modal: información del ciclo -->
<div id="info-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="info-modal-title">
    <div class="modal-content info-modal-content">
        <h3 id="info-modal-title" class="modal-title">Información</h3>
        <p id="info-modal-text" class="info-modal-text"></p>

        <div class="modal-actions">
            <button id="close-info-modal-btn" class="modal-button primary" type="button">Entendido</button>
        </div>
    </div>
</div>
</body>
</html>
